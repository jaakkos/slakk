[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slakk"
version = "0.5.0"
description = "Norwegian terrain-based ascent planning. Generates unverified GPX candidates."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.0,<3",
    "Pillow>=10.4,<14",
]

[project.scripts]
slakk = "slakk:main"

[tool.setuptools]
py-modules = ["slakk"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Ruff's default rules. The code uses short lambdas on purpose.
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"]
