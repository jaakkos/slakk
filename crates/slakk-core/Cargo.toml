[package]
name = "slakk-core"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "Browser/Wasm core for slakk ascent planning"
repository = "https://github.com/jaakkos/slakk"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
approx = "0.5"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
